<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>User Management | EASYPIE Admin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      :root {
        --primary-bg: #060b13;
        --secondary-bg: #0a0f1a;
        --sidebar-bg: #0d121f;
        --accent-color: #3b82f6;
        --card-bg: rgba(31, 41, 55, 0.4);
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --glass-border: rgba(255, 255, 255, 0.08);
        --sidebar-width: 260px;
        --header-height: 60px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        background-color: var(--primary-bg);
        color: var(--text-main);
        width: 100%;
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      aside {
        width: min(80vw, var(--sidebar-width));
        background: var(--sidebar-bg);
        border-right: 1px solid var(--glass-border);
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        height: 100dvh;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 1000;
        display: flex;
        flex-direction: column;
      }
      aside.active {
        transform: translateX(0);
      }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .sidebar-backdrop.active {
        display: block;
        opacity: 1;
        pointer-events: auto;
      }

      .sidebar-header {
        padding: 22px 20px;
        font-size: 20px;
        font-weight: 800;
        color: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--glass-border);
      }

      .sidebar-close {
        font-size: 18px;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px;
      }

      .nav-item {
        padding: 14px 22px;
        display: flex;
        align-items: center;
        gap: 15px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
        min-height: 48px;
      }
      .nav-item i {
        width: 20px;
        text-align: center;
      }
      .nav-item:hover,
      .nav-item.active {
        background: rgba(59, 130, 246, 0.1);
        color: var(--accent-color);
        border-left: 4px solid var(--accent-color);
      }

      main {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }

      header {
        height: var(--header-height);
        background: var(--secondary-bg);
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 14px;
        position: sticky;
        top: 0;
        z-index: 900;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .header-left h2 {
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #mobileMenuBtn {
        font-size: 20px;
        cursor: pointer;
        color: var(--text-muted);
        padding: 8px;
        flex-shrink: 0;
      }

      #adminProfile {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      #adminName {
        display: none;
      }

      .container {
        padding: 16px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 18px;
      }
      .stat-mini-card {
        background: var(--card-bg);
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--glass-border);
      }
      .stat-mini-card p {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .stat-mini-card h3 {
        font-size: 18px;
        font-weight: 700;
      }

      .toolbar {
        background: var(--card-bg);
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--glass-border);
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .search-input {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        padding: 12px 14px;
        border-radius: 10px;
        color: white;
        outline: none;
        font-size: 14px;
      }
      .toolbar-row {
        display: flex;
        gap: 10px;
      }
      .filter-select {
        flex: 1;
        background: var(--secondary-bg);
        color: white;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--glass-border);
        outline: none;
        font-size: 13px;
      }
      .btn-export {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
      }

      .table-container {
        background: var(--card-bg);
        border-radius: 18px;
        border: 1px solid var(--glass-border);
      }

      table {
        display: none;
      }

      .mobile-user-list {
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }

      .user-card {
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .user-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .user-cell {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex-shrink: 0;
      }
      .user-name-block {
        min-width: 0;
      }
      .user-name-block p:first-child {
        font-weight: 700;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .user-card-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-size: 13px;
      }
      .user-card-details .label {
        color: var(--text-muted);
        font-size: 11px;
        text-transform: uppercase;
        display: block;
        margin-bottom: 2px;
      }
      .investment-line {
        display: block;
        font-size: 12px;
        line-height: 1.5;
      }
      .investment-line .amt {
        color: var(--success);
        font-weight: 600;
      }
      .no-plan {
        color: var(--text-muted);
        font-style: italic;
      }

      .user-card-actions {
        display: flex;
        gap: 8px;
        border-top: 1px solid var(--glass-border);
        padding-top: 10px;
      }

      .status-pill {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .active {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
      }
      .suspended {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
      }

      .btn-action-icon {
        background: rgba(255, 255, 255, 0.04);
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 15px;
        padding: 10px 14px;
        border-radius: 8px;
        flex: 1;
        min-height: 40px;
      }
      .btn-action-icon:active,
      .btn-action-icon:hover {
        color: var(--accent-color);
      }

      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin-top: 20px;
      }
      .btn-page {
        background: var(--card-bg);
        color: white;
        border: 1px solid var(--glass-border);
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        min-height: 44px;
        min-width: 44px;
      }
      .btn-page:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 2000;
        backdrop-filter: blur(8px);
      }
      .modal-content {
        background: var(--sidebar-bg);
        width: 100%;
        max-width: 800px;
        border-radius: 20px 20px 0 0;
        border: 1px solid var(--glass-border);
        max-height: 92vh;
        overflow-y: auto;
        position: relative;
      }
      .modal-header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        background: var(--sidebar-bg);
        z-index: 10;
      }
      .modal-body {
        padding: 20px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 24px;
      }
      .detail-item label {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      .detail-item p {
        font-size: 14px;
        font-weight: 600;
        word-break: break-word;
      }

      .modal-stats-grid {
        background: rgba(0, 0, 0, 0.2);
        padding: 16px;
        border-radius: 14px;
        margin-bottom: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .modal-plan-list {
        background: rgba(0, 0, 0, 0.2);
        padding: 16px;
        border-radius: 14px;
        margin-bottom: 16px;
      }
      .modal-plan-list h4 {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
      }
      .plan-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--glass-border);
        font-size: 13px;
      }
      .plan-row:last-child {
        border-bottom: none;
      }
      .plan-row .plan-name {
        font-weight: 600;
      }
      .plan-row .plan-status {
        font-size: 10px;
        text-transform: uppercase;
        margin-left: 8px;
        color: var(--text-muted);
      }
      .plan-row .plan-amount {
        color: var(--success);
        font-weight: 700;
      }

      /* --- NEW: balance adjustment panel --- */
      .balance-adjust-input {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        padding: 12px;
        color: white;
        outline: none;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .balance-adjust-reason {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        padding: 10px;
        color: white;
        outline: none;
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
        min-height: 50px;
        margin-bottom: 10px;
      }
      .balance-adjust-btns {
        display: flex;
        gap: 10px;
      }
      .btn-add-funds {
        flex: 1;
        background: var(--success);
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      .btn-deduct-funds {
        flex: 1;
        background: var(--danger);
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }

      .modal-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
      }

      .tab-menu {
        display: flex;
        gap: 16px;
        border-bottom: 1px solid var(--glass-border);
        margin-bottom: 16px;
        overflow-x: auto;
      }
      .tab-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        padding-bottom: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tab-btn.active {
        color: var(--accent-color);
        border-bottom-color: var(--accent-color);
      }

      .overlay-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--primary-bg);
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (min-width: 480px) {
        .stats-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (min-width: 640px) {
        .toolbar {
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
        }
        .search-input {
          flex: 1;
          min-width: 220px;
          width: auto;
        }
        .toolbar-row {
          display: contents;
        }
        .filter-select {
          flex: none;
          width: auto;
        }

        .modal-overlay {
          align-items: center;
        }
        .modal-content {
          border-radius: 24px;
          max-height: 90vh;
        }
        .modal-actions {
          flex-direction: row;
        }
      }

      @media (min-width: 768px) {
        table {
          display: table;
          width: 100%;
          border-collapse: collapse;
          min-width: 700px;
        }
        .mobile-user-list {
          display: none;
        }
        .table-container {
          overflow-x: auto;
        }

        th {
          text-align: left;
          padding: 15px;
          color: var(--text-muted);
          font-size: 12px;
          text-transform: uppercase;
          border-bottom: 1px solid var(--glass-border);
        }
        td {
          padding: 15px;
          font-size: 13px;
          border-bottom: 1px solid var(--glass-border);
          vertical-align: middle;
        }

        .btn-action-icon {
          flex: none;
          background: none;
          padding: 5px;
          min-height: auto;
        }
      }

      @media (min-width: 1024px) {
        .sidebar-backdrop {
          display: none !important;
        }
        aside {
          transform: none;
          width: var(--sidebar-width);
        }
        main {
          margin-left: var(--sidebar-width);
        }
        #mobileMenuBtn {
          display: none;
        }
        #adminName {
          display: inline;
          font-size: 12px;
          font-weight: 600;
        }
        .container {
          padding: 25px;
        }
        .stats-grid {
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" class="overlay-loader">
      <i
        class="fas fa-circle-notch fa-spin"
        style="font-size: 30px; color: var(--accent-color)"
      ></i>
    </div>

    <div
      class="sidebar-backdrop"
      id="sidebarBackdrop"
      onclick="closeSidebar()"
    ></div>

    <aside id="sidebar">
      <div class="sidebar-header">
        EASYPIE ADMIN
        <i class="fas fa-times sidebar-close" onclick="closeSidebar()"></i>
      </div>
      <nav style="flex: 1; overflow-y: auto">
        <a href="index.html" class="nav-item"
          ><i class="fas fa-th-large"></i> Dashboard</a
        >
        <a href="users.html" class="nav-item active"
          ><i class="fas fa-users"></i> Users</a
        >
        <a href="deposits.html" class="nav-item"
          ><i class="fas fa-arrow-down"></i> Deposits</a
        >
        <a href="withdrawals.html" class="nav-item"
          ><i class="fas fa-arrow-up"></i> Withdrawals</a
        >
        <a href="investments.html" class="nav-item"
          ><i class="fas fa-rocket"></i> Investments</a
        >
        <a href="giftcodes.html" class="nav-item"
          ><i class="fas fa-gift"></i> Gift Codes</a
        >
        <a href="support.html" class="nav-item"
          ><i class="fas fa-headset"></i> Support Tickets</a
        >
        <a href="settings.html" class="nav-item"
          ><i class="fas fa-cog"></i> Settings</a
        >
      </nav>
      <a
        href="#"
        onclick="adminLogout()"
        class="nav-item"
        style="color: var(--danger); border-top: 1px solid var(--glass-border)"
        ><i class="fas fa-sign-out-alt"></i> Logout</a
      >
    </aside>

    <main>
      <header>
        <div class="header-left">
          <i class="fas fa-bars" id="mobileMenuBtn"></i>
          <h2>User Management</h2>
        </div>
        <div id="adminProfile">
          <span id="adminName">Admin</span>
          <div
            class="user-avatar"
            style="width: 30px; height: 30px; font-size: 10px"
          >
            AD
          </div>
        </div>
      </header>

      <div class="container">
        <div class="stats-grid">
          <div class="stat-mini-card">
            <p>Total Users</p>
            <h3 id="totalUsers">0</h3>
          </div>
          <div class="stat-mini-card">
            <p>Active</p>
            <h3 id="activeUsersCount" style="color: var(--success)">0</h3>
          </div>
          <div class="stat-mini-card">
            <p>Suspended</p>
            <h3 id="suspendedUsersCount" style="color: var(--danger)">0</h3>
          </div>
          <div class="stat-mini-card">
            <p>New Today</p>
            <h3 id="newUsersCount" style="color: var(--accent-color)">0</h3>
          </div>
        </div>

        <div class="toolbar">
          <input
            type="text"
            class="search-input"
            id="userSearch"
            placeholder="Search name, email, username, or ID..."
          />
          <div class="toolbar-row">
            <select class="filter-select" id="statusFilter">
              <option value="all">All Status</option>
              <option value="active">Active</option>
              <option value="suspended">Suspended</option>
            </select>
            <button class="btn-export" onclick="exportUsers()">
              <i class="fas fa-file-csv"></i> Export CSV
            </button>
          </div>
        </div>

        <div class="table-container">
          <div class="mobile-user-list" id="usersCardList"></div>

          <table>
            <thead>
              <tr>
                <th>User Details</th>
                <th>Username</th>
                <th>Wallet</th>
                <th>Investments</th>
                <th>Joined</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>

        <div class="pagination">
          <button class="btn-page" id="prevPage">
            <i class="fas fa-chevron-left"></i>
          </button>
          <span id="pageInfo" style="font-size: 13px; color: var(--text-muted)"
            >Page 1 of 1</span
          >
          <button class="btn-page" id="nextPage">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </main>

    <!-- User Detail Modal -->
    <div class="modal-overlay" id="userModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>User Profile Details</h3>
          <i
            class="fas fa-times"
            onclick="closeModal()"
            style="cursor: pointer; padding: 6px"
          ></i>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <script type="module">
      const SB_URL = import.meta.env.VITE_SUPABASE_URL;
      const SB_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
      const supabase = window.supabase.createClient(SB_URL, SB_KEY);

      let usersData = [];
      let filteredUsers = [];
      let currentPage = 1;
      const perPage = 15;
      let currentAdminId = null; // NEW: needed to log who made a balance adjustment

      async function init() {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        if (!session) {
          window.location.href = "login.html";
          return;
        }

        const { data: profile } = await supabase
          .from("profiles")
          .select("is_admin, full_name")
          .eq("id", session.user.id)
          .single();
        if (!profile?.is_admin) {
          window.location.href = "../login.html";
          return;
        }

        currentAdminId = session.user.id;
        document.getElementById("adminName").innerText = profile.full_name;
        document.getElementById("loader").style.display = "none";

        await fetchUsers();
        setupEventListeners();
        setupRealtime();
      }

      async function fetchUsers() {
        const { data, error } = await supabase
          .from("profiles")
          .select(
            `
                    *,
                    wallets(balance),
                    investments(id, status, plan_name, amount)
                `,
          )
          .order("created_at", { ascending: false });

        if (error) {
          console.error("fetchUsers error:", error);
          alert("Could not load users: " + error.message);
          return;
        }

        if (data) {
          usersData = data;
          applyFilters();
          updateStats();
        }
      }

      function updateStats() {
        document.getElementById("totalUsers").innerText = usersData.length;
        document.getElementById("activeUsersCount").innerText =
          usersData.filter((u) => u.status !== "suspended").length;
        document.getElementById("suspendedUsersCount").innerText =
          usersData.filter((u) => u.status === "suspended").length;
        const today = new Date().toDateString();
        document.getElementById("newUsersCount").innerText = usersData.filter(
          (u) => new Date(u.created_at).toDateString() === today,
        ).length;
      }

      function applyFilters() {
        const query = document.getElementById("userSearch").value.toLowerCase();
        const status = document.getElementById("statusFilter").value;

        filteredUsers = usersData.filter((u) => {
          const matchSearch =
            u.full_name.toLowerCase().includes(query) ||
            u.email?.toLowerCase().includes(query) ||
            u.username.toLowerCase().includes(query) ||
            u.id.includes(query);
          const matchStatus =
            status === "all" ||
            (status === "active"
              ? u.status !== "suspended"
              : u.status === "suspended");
          return matchSearch && matchStatus;
        });

        renderTable();
      }

      function formatInvestments(investments, { compact = false } = {}) {
        const list = investments || [];
        if (list.length === 0) {
          return `<span class="no-plan">No plan</span>`;
        }
        const sorted = [...list].sort(
          (a, b) =>
            (a.status === "active" ? -1 : 1) - (b.status === "active" ? -1 : 1),
        );
        const toShow = compact ? sorted.slice(0, 2) : sorted;
        const rows = toShow
          .map(
            (i) => `
                <span class="investment-line">
                    ${i.plan_name || "Unnamed Plan"} · <span class="amt">₦${parseFloat(i.amount || 0).toLocaleString()}</span>
                    ${i.status !== "active" ? `<span style="color:var(--text-muted); font-size:10px;"> (${i.status})</span>` : ""}
                </span>
            `,
          )
          .join("");
        const overflow =
          compact && sorted.length > 2
            ? `<span class="investment-line" style="color:var(--text-muted)">+${sorted.length - 2} more</span>`
            : "";
        return rows + overflow;
      }

      function renderTable() {
        const tableBody = document.getElementById("usersTableBody");
        const cardList = document.getElementById("usersCardList");
        tableBody.innerHTML = "";
        cardList.innerHTML = "";

        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const paginated = filteredUsers.slice(start, end);

        if (paginated.length === 0) {
          tableBody.innerHTML =
            '<tr><td colspan="7" style="text-align:center; padding:20px; color:var(--text-muted);">No users found.</td></tr>';
          cardList.innerHTML =
            '<div style="text-align:center; padding:24px; color:var(--text-muted); font-size:13px;">No users found.</div>';
        }

        paginated.forEach((u) => {
          const balance = u.wallets?.[0]?.balance || 0;
          const investmentsHtml = formatInvestments(u.investments, {
            compact: true,
          });
          const statusClass = u.status === "suspended" ? "suspended" : "active";
          const statusLabel = u.status || "active";
          const joined = new Date(u.created_at).toLocaleDateString();

          const row = document.createElement("tr");
          row.innerHTML = `
                    <td>
                        <div class="user-cell">
                            <div class="user-avatar">${u.full_name.charAt(0)}</div>
                            <div>
                                <p style="font-weight:700">${u.full_name}</p>
                                <p style="font-size:11px; color:var(--text-muted)">${u.id.slice(0, 8)}</p>
                            </div>
                        </div>
                    </td>
                    <td>@${u.username}</td>
                    <td><b>₦${parseFloat(balance).toLocaleString()}</b></td>
                    <td>${investmentsHtml}</td>
                    <td>${joined}</td>
                    <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
                    <td>
                        <button class="btn-action-icon" onclick="viewUser('${u.id}')" title="View"><i class="fas fa-eye"></i></button>
                        <button class="btn-action-icon" onclick="toggleSuspend('${u.id}', '${u.status}')" title="${u.status === "suspended" ? "Activate" : "Suspend"}"><i class="fas ${u.status === "suspended" ? "fa-user-check" : "fa-user-slash"}"></i></button>
                        <button class="btn-action-icon" style="color:var(--danger)" onclick="deleteUser('${u.id}')" title="Delete"><i class="fas fa-trash"></i></button>
                    </td>
                `;
          tableBody.appendChild(row);

          const card = document.createElement("div");
          card.className = "user-card";
          card.innerHTML = `
                    <div class="user-card-top">
                        <div class="user-cell">
                            <div class="user-avatar">${u.full_name.charAt(0)}</div>
                            <div class="user-name-block">
                                <p>${u.full_name}</p>
                                <p style="font-size:11px; color:var(--text-muted)">@${u.username}</p>
                            </div>
                        </div>
                        <span class="status-pill ${statusClass}">${statusLabel}</span>
                    </div>
                    <div class="user-card-details">
                        <div><span class="label">Wallet</span>₦${parseFloat(balance).toLocaleString()}</div>
                        <div><span class="label">Investments</span>${investmentsHtml}</div>
                        <div><span class="label">Joined</span>${joined}</div>
                        <div><span class="label">ID</span>${u.id.slice(0, 8)}</div>
                    </div>
                    <div class="user-card-actions">
                        <button class="btn-action-icon" onclick="viewUser('${u.id}')"><i class="fas fa-eye"></i></button>
                        <button class="btn-action-icon" onclick="toggleSuspend('${u.id}', '${u.status}')"><i class="fas ${u.status === "suspended" ? "fa-user-check" : "fa-user-slash"}"></i></button>
                        <button class="btn-action-icon" style="color:var(--danger)" onclick="deleteUser('${u.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                `;
          cardList.appendChild(card);
        });

        const totalPages = Math.ceil(filteredUsers.length / perPage) || 1;
        document.getElementById("pageInfo").innerText =
          `Page ${currentPage} of ${totalPages}`;
        document.getElementById("prevPage").disabled = currentPage === 1;
        document.getElementById("nextPage").disabled =
          currentPage === totalPages;
      }

      window.viewUser = (id) => {
        const u = usersData.find((user) => user.id === id);
        const balance = u.wallets?.[0]?.balance || 0;
        const investments = u.investments || [];
        const activeInvs = investments.filter(
          (i) => i.status === "active",
        ).length;

        const modal = document.getElementById("userModal");
        const body = document.getElementById("modalBody");

        const planRows =
          investments.length > 0
            ? investments
                .map(
                  (i) => `
                    <div class="plan-row">
                        <span class="plan-name">${i.plan_name || "Unnamed Plan"}<span class="plan-status">${i.status}</span></span>
                        <span class="plan-amount">₦${parseFloat(i.amount || 0).toLocaleString()}</span>
                    </div>
                `,
                )
                .join("")
            : `<div class="plan-row"><span class="no-plan">No investment plans yet</span></div>`;

        body.innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item"><label>Full Name</label><p>${u.full_name}</p></div>
                    <div class="detail-item"><label>Username</label><p>@${u.username}</p></div>
                    <div class="detail-item"><label>Phone</label><p>${u.phone || "N/A"}</p></div>
                    <div class="detail-item"><label>Joined Date</label><p>${new Date(u.created_at).toLocaleString()}</p></div>
                </div>
                <div class="modal-stats-grid">
                    <div><label style="font-size:10px; color:var(--text-muted)">WALLET BALANCE</label><h2 style="color:var(--success)">₦${parseFloat(balance).toLocaleString()}</h2></div>
                    <div><label style="font-size:10px; color:var(--text-muted)">ACTIVE INVESTMENTS</label><h2>${activeInvs}</h2></div>
                </div>
                <div class="modal-plan-list">
                    <h4>Investment Plans</h4>
                    ${planRows}
                </div>

                <!-- NEW: Balance adjustment panel -->
                <div class="modal-plan-list">
                    <h4>Adjust Wallet Balance</h4>
                    <input type="number" id="balanceAdjustAmount" class="balance-adjust-input" placeholder="Amount (₦)" min="0">
                    <textarea id="balanceAdjustReason" class="balance-adjust-reason" placeholder="Reason (sent to user in notification, optional)"></textarea>
                    <div class="balance-adjust-btns">
                        <button class="btn-add-funds" onclick="adjustBalance('${u.id}', 'add')">Add Funds</button>
                        <button class="btn-deduct-funds" onclick="adjustBalance('${u.id}', 'subtract')">Deduct Funds</button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="btn-export" style="flex:1" onclick="sendDirectNotification('${u.id}')">Send Notification</button>
                    <button class="btn-export" style="flex:1; background:var(--warning)" onclick="resetUserWallet('${u.id}')">Reset Wallet</button>
                </div>
            `;
        modal.style.display = "flex";
      };

      // NEW: Add or deduct funds from a user's wallet. Logs a transaction + notification
      // so it shows up in the user's own transaction history and the admin_logs audit trail.
      // Requires the "Admins can update any wallet" / "...insert transactions/notifications
      // for any user" RLS policies — without those, this will fail with a permissions error.
      window.adjustBalance = async (userId, mode) => {
        const amountInput = document.getElementById("balanceAdjustAmount");
        const reasonInput = document.getElementById("balanceAdjustReason");
        const amount = parseFloat(amountInput.value);
        const reason = reasonInput.value.trim();

        if (!amount || amount <= 0) {
          alert("Enter a valid amount greater than 0.");
          return;
        }

        const u = usersData.find((user) => user.id === userId);
        const currentBalance = parseFloat(u.wallets?.[0]?.balance || 0);
        const delta = mode === "add" ? amount : -amount;
        const newBalance = currentBalance + delta;

        if (mode === "subtract" && amount > currentBalance) {
          if (
            !confirm(
              `${u.full_name}'s current balance is ₦${currentBalance.toLocaleString()}. Deducting ₦${amount.toLocaleString()} will take it negative (₦${newBalance.toLocaleString()}). Continue anyway?`,
            )
          )
            return;
        }

        if (
          !confirm(
            `${mode === "add" ? "Add" : "Deduct"} ₦${amount.toLocaleString()} ${mode === "add" ? "to" : "from"} ${u.full_name}'s wallet?\n\nNew balance will be ₦${newBalance.toLocaleString()}.`,
          )
        )
          return;

        try {
          const { error: wErr } = await supabase
            .from("wallets")
            .update({ balance: newBalance })
            .eq("user_id", userId);
          if (wErr) throw wErr;

          // Reuses the 'bonus' (positive) / 'withdrawal' (negative) transaction types
          // so it displays with correct +/- coloring on transactions.html without
          // needing changes there.
          await supabase.from("transactions").insert([
            {
              user_id: userId,
              amount: amount,
              type: mode === "add" ? "bonus" : "withdrawal",
              description:
                reason ||
                (mode === "add"
                  ? "Balance credited by admin"
                  : "Balance deducted by admin"),
            },
          ]);

          await supabase.from("notifications").insert([
            {
              user_id: userId,
              title: mode === "add" ? "Balance Credited" : "Balance Adjusted",
              message:
                mode === "add"
                  ? `₦${amount.toLocaleString()} was added to your wallet by admin.${reason ? " Reason: " + reason : ""}`
                  : `₦${amount.toLocaleString()} was deducted from your wallet by admin.${reason ? " Reason: " + reason : ""}`,
            },
          ]);

          await supabase.from("admin_logs").insert([
            {
              admin_id: currentAdminId,
              action: `${mode === "add" ? "Added" : "Deducted"} ₦${amount.toLocaleString()} ${mode === "add" ? "to" : "from"} user #${userId.slice(0, 8)}${reason ? " — " + reason : ""}`,
              target_id: userId,
            },
          ]);

          alert("Balance updated successfully.");
          closeModal();
          fetchUsers();
        } catch (err) {
          alert("Error: " + err.message);
        }
      };

      window.toggleSuspend = async (id, currentStatus) => {
        const newStatus =
          currentStatus === "suspended" ? "active" : "suspended";
        if (confirm(`Are you sure you want to ${newStatus} this user?`)) {
          const { error } = await supabase
            .from("profiles")
            .update({ status: newStatus })
            .eq("id", id);
          if (!error) fetchUsers();
        }
      };

      window.deleteUser = async (id) => {
        if (
          confirm(
            "DANGER: This action is irreversible. Delete user and all associated records?",
          )
        ) {
          const { error } = await supabase
            .from("profiles")
            .delete()
            .eq("id", id);
          if (!error) fetchUsers();
          else alert("Could not delete. Check database constraints.");
        }
      };

      window.exportUsers = () => {
        let csv = "ID,Name,Username,Status,Balance,Joined\n";
        filteredUsers.forEach((u) => {
          csv += `${u.id},${u.full_name},${u.username},${u.status || "active"},${u.wallets?.[0]?.balance || 0},${u.created_at}\n`;
        });
        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `easypie_users_${Date.now()}.csv`;
        a.click();
      };

      function setupEventListeners() {
        document.getElementById("userSearch").addEventListener("input", () => {
          currentPage = 1;
          applyFilters();
        });
        document
          .getElementById("statusFilter")
          .addEventListener("change", () => {
            currentPage = 1;
            applyFilters();
          });
        document.getElementById("prevPage").onclick = () => {
          if (currentPage > 1) {
            currentPage--;
            renderTable();
          }
        };
        document.getElementById("nextPage").onclick = () => {
          if (currentPage * perPage < filteredUsers.length) {
            currentPage++;
            renderTable();
          }
        };
        document.getElementById("mobileMenuBtn").onclick = () => {
          document.getElementById("sidebar").classList.add("active");
          document.getElementById("sidebarBackdrop").classList.add("active");
        };
      }

      window.closeSidebar = () => {
        document.getElementById("sidebar").classList.remove("active");
        document.getElementById("sidebarBackdrop").classList.remove("active");
      };

      function setupRealtime() {
        supabase
          .channel("public:profiles")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "profiles" },
            fetchUsers,
          )
          .subscribe();
      }

      window.closeModal = () =>
        (document.getElementById("userModal").style.display = "none");

      window.adminLogout = async () => {
        await supabase.auth.signOut();
        window.location.href = "login.html";
      };

      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
